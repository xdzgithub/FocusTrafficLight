name: FocusTrafficLight
options:
  bundleIdPrefix: com.focustrafficlight
  deploymentTarget:
    macOS: "27.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    PRODUCT_NAME: Focus TrafficLight
    MARKETING_VERSION: "5.0.0"
    CURRENT_PROJECT_VERSION: "25"
    SWIFT_VERSION: "5.0"
    ENABLE_HARDENED_RUNTIME: NO
    # A stable signing identity keeps the TCC designated requirement stable.
    # Ad-hoc signing ("-") ties the Accessibility grant to the binary's cdhash,
    # so macOS 27 revokes it on every rebuild and the app has to be re-added in
    # System Settings each time.
    CODE_SIGN_IDENTITY: "Focus TrafficLight Local Signing"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""

targets:
  FocusTrafficLight:
    type: application
    platform: macOS
    sources:
      - Sources
      - Resources
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: FocusTrafficLight.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.focustrafficlight.app
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
